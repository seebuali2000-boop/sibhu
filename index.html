<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking Robot - Hindi to English</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-panel: rgba(20, 20, 35, 0.7);
            --accent: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.4);
            --accent-secondary: #7b61ff;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --success: #00ff88;
            --error: #ff4466;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            50% { transform: translateY(-100px) translateX(50px); opacity: 0.8; }
        }

        /* Status bar at top */
        .status-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: var(--bg-panel);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            font-size: 14px;
            color: var(--text-secondary);
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .status-badge.listening {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .status-badge.speaking {
            border-color: var(--success);
            color: var(--success);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .status-badge.listening .status-dot {
            background: var(--accent);
            animation: pulse-dot 1s infinite;
        }

        .status-badge.speaking .status-dot {
            background: var(--success);
            animation: pulse-dot 0.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* Main robot container */
        .robot-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        /* Siri-style pulsing rings */
        .siri-rings {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
            opacity: 0;
        }

        .ring:nth-child(1) {
            width: 100%;
            height: 100%;
            border-color: rgba(0, 212, 255, 0.1);
            animation: ring-expand 3s infinite ease-out;
        }

        .ring:nth-child(2) {
            width: 80%;
            height: 80%;
            border-color: rgba(0, 212, 255, 0.15);
            animation: ring-expand 3s infinite ease-out 0.5s;
        }

        .ring:nth-child(3) {
            width: 60%;
            height: 60%;
            border-color: rgba(123, 97, 255, 0.2);
            animation: ring-expand 3s infinite ease-out 1s;
        }

        .ring:nth-child(4) {
            width: 40%;
            height: 40%;
            border-color: rgba(0, 212, 255, 0.25);
            animation: ring-expand 3s infinite ease-out 1.5s;
        }

        @keyframes ring-expand {
            0% { transform: scale(0.8); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        /* Active listening rings */
        .robot-container.listening .ring {
            border-color: var(--accent);
        }

        .robot-container.listening .ring:nth-child(1) { animation-duration: 1.5s; }
        .robot-container.listening .ring:nth-child(2) { animation-duration: 1.5s; }
        .robot-container.listening .ring:nth-child(3) { animation-duration: 1.5s; }
        .robot-container.listening .ring:nth-child(4) { animation-duration: 1.5s; }

        /* Speaking animation */
        .robot-container.speaking .ring {
            border-color: var(--success);
        }

        .robot-container.speaking .ring:nth-child(1) { animation-duration: 0.6s; }
        .robot-container.speaking .ring:nth-child(2) { animation-duration: 0.6s; }
        .robot-container.speaking .ring:nth-child(3) { animation-duration: 0.6s; }
        .robot-container.speaking .ring:nth-child(4) { animation-duration: 0.6s; }

        /* Sound wave bars */
        .sound-waves {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 4px;
            height: 40px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .robot-container.listening .sound-waves,
        .robot-container.speaking .sound-waves {
            opacity: 1;
        }

        .wave-bar {
            width: 4px;
            background: linear-gradient(to top, var(--accent), var(--accent-secondary));
            border-radius: 2px;
            animation: wave 1s infinite ease-in-out;
        }

        .robot-container.speaking .wave-bar {
            background: linear-gradient(to top, var(--success), #00ffcc);
        }

        .wave-bar:nth-child(1) { height: 20%; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 40%; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 60%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 80%; animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { height: 100%; animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { height: 80%; animation-delay: 0.5s; }
        .wave-bar:nth-child(7) { height: 60%; animation-delay: 0.6s; }
        .wave-bar:nth-child(8) { height: 40%; animation-delay: 0.7s; }
        .wave-bar:nth-child(9) { height: 20%; animation-delay: 0.8s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }

        /* Robot SVG */
        .robot-svg {
            width: 180px;
            height: 180px;
            filter: drop-shadow(0 0 30px var(--accent-glow));
            transition: all 0.3s ease;
            z-index: 3;
        }

        .robot-container.listening .robot-svg {
            filter: drop-shadow(0 0 50px var(--accent-glow));
            transform: scale(1.05);
        }

        .robot-container.speaking .robot-svg {
            filter: drop-shadow(0 0 50px rgba(0, 255, 136, 0.4));
            transform: scale(1.05);
        }

        .robot-eye {
            animation: blink 4s infinite;
            transform-origin: center;
        }

        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        .robot-mouth {
            transition: all 0.2s ease;
        }

        .robot-container.speaking .robot-mouth {
            animation: mouth-talk 0.3s infinite alternate;
        }

        @keyframes mouth-talk {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(1.5); }
        }

        /* Text display area */
        .text-display {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            z-index: 10;
        }

        .text-card {
            background: var(--bg-panel);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(20px);
            margin-bottom: 12px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .text-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .text-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .text-content {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .text-card.english .text-label {
            color: var(--success);
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .mic-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 30px var(--accent-glow);
            transition: all 0.3s ease;
            position: relative;
        }

        .mic-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 40px var(--accent-glow);
        }

        .mic-btn:active {
            transform: scale(0.95);
        }

        .mic-btn.listening {
            background: linear-gradient(135deg, var(--error), #ff6b6b);
            box-shadow: 0 4px 30px rgba(255, 68, 102, 0.4);
            animation: mic-pulse 1.5s infinite;
        }

        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 4px 30px rgba(255, 68, 102, 0.4); }
            50% { box-shadow: 0 4px 50px rgba(255, 68, 102, 0.7); }
        }

        .hint-text {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-secondary);
            font-size: 13px;
            text-align: center;
            z-index: 10;
        }

        /* Language indicators */
        .lang-bar {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .lang-pill {
            padding: 6px 16px;
            border-radius: 20px;
            background: var(--bg-panel);
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-pill .arrow {
            color: var(--accent);
        }

        .lang-pill.active {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* Error / Info toast */
        .toast {
            position: fixed;
            top: 120px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(255, 68, 102, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 20;
            backdrop-filter: blur(10px);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.info {
            background: rgba(0, 212, 255, 0.9);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .robot-container {
                width: 260px;
                height: 260px;
            }
            .robot-svg {
                width: 140px;
                height: 140px;
            }
            .text-display {
                bottom: 100px;
            }
        }
    </style>
</head>
<body>

    <!-- Background particles -->
    <div class="bg-particles" id="particles"></div>

    <!-- Language bar -->
    <div class="lang-bar">
        <div class="lang-pill active">
            <span>Hindi</span>
            <span class="arrow">→</span>
            <span>English</span>
        </div>
    </div>

    <!-- Status -->
    <div class="status-bar">
        <div class="status-badge" id="statusBadge">
            <div class="status-dot"></div>
            <span id="statusText">Tap mic & speak in Hindi</span>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Robot with Siri animation -->
    <div class="robot-container" id="robotContainer">
        <div class="siri-rings">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
        </div>

        <!-- Robot SVG -->
        <svg class="robot-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Robot head -->
            <rect x="40" y="50" width="120" height="100" rx="25" fill="#1a1a2e" stroke="var(--accent)" stroke-width="2"/>
            <!-- Antenna -->
            <line x1="100" y1="50" x2="100" y2="25" stroke="var(--accent)" stroke-width="2"/>
            <circle cx="100" cy="20" r="8" fill="var(--accent)" opacity="0.8">
                <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
            </circle>
            <!-- Left eye -->
            <ellipse class="robot-eye" cx="75" cy="85" rx="14" ry="16" fill="#0a0a0f" stroke="var(--accent)" stroke-width="2"/>
            <circle cx="78" cy="82" r="5" fill="var(--accent)" opacity="0.9"/>
            <!-- Right eye -->
            <ellipse class="robot-eye" cx="125" cy="85" rx="14" ry="16" fill="#0a0a0f" stroke="var(--accent)" stroke-width="2"/>
            <circle cx="128" cy="82" r="5" fill="var(--accent)" opacity="0.9"/>
            <!-- Mouth -->
            <rect class="robot-mouth" x="80" y="120" width="40" height="8" rx="4" fill="var(--success)" opacity="0.8"/>
            <!-- Ear left -->
            <rect x="25" y="80" width="15" height="30" rx="7" fill="#1a1a2e" stroke="var(--accent-secondary)" stroke-width="2"/>
            <!-- Ear right -->
            <rect x="160" y="80" width="15" height="30" rx="7" fill="#1a1a2e" stroke="var(--accent-secondary)" stroke-width="2"/>
            <!-- Neck -->
            <rect x="90" y="150" width="20" height="15" fill="#1a1a2e" stroke="var(--accent)" stroke-width="1"/>
            <!-- Body hint -->
            <path d="M60 165 Q100 180 140 165" stroke="var(--accent)" stroke-width="2" fill="none" opacity="0.5"/>
        </svg>

        <!-- Sound waves -->
        <div class="sound-waves">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>
    </div>

    <!-- Hint -->
    <div class="hint-text" id="hintText">Press the microphone and speak in Hindi</div>

    <!-- Text display -->
    <div class="text-display">
        <div class="text-card" id="hindiCard">
            <div class="text-label">You said (Hindi)</div>
            <div class="text-content" id="hindiText">...</div>
        </div>
        <div class="text-card english" id="englishCard">
            <div class="text-label">Translation (English)</div>
            <div class="text-content" id="englishText">...</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="mic-btn" id="micBtn" onclick="toggleMic()">
            <span id="micIcon">🎙️</span>
        </button>
    </div>

    <script>
        // Create background particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 15 + 's';
            p.style.animationDuration = (10 + Math.random() * 10) + 's';
            particlesContainer.appendChild(p);
        }

        // Elements
        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const robotContainer = document.getElementById('robotContainer');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const hindiCard = document.getElementById('hindiCard');
        const englishCard = document.getElementById('englishCard');
        const hindiText = document.getElementById('hindiText');
        const englishText = document.getElementById('englishText');
        const hintText = document.getElementById('hintText');
        const toast = document.getElementById('toast');

        let isListening = false;
        let recognition = null;

        // Check browser support
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            showToast('Speech recognition not supported. Please use Chrome or Edge.', true);
            micBtn.disabled = true;
            micBtn.style.opacity = '0.5';
        } else {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'hi-IN'; // Hindi

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                micIcon.textContent = '⏹️';
                robotContainer.classList.add('listening');
                statusBadge.classList.add('listening');
                statusText.textContent = 'Listening... Speak in Hindi';
                hintText.textContent = 'I am listening...';
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
                micIcon.textContent = '🎙️';
                robotContainer.classList.remove('listening');
                statusBadge.classList.remove('listening');
                statusText.textContent = 'Tap mic & speak in Hindi';
                hintText.textContent = 'Press the microphone and speak in Hindi';
            };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                hindiText.textContent = transcript;
                hindiCard.classList.add('visible');
                englishCard.classList.remove('visible');
                statusText.textContent = 'Translating...';
                hintText.textContent = 'Translating to English...';

                // Translate
                const translation = await translateHindiToEnglish(transcript);
                englishText.textContent = translation;
                englishCard.classList.add('visible');

                // Speak
                speakEnglish(translation);
            };

            recognition.onerror = (event) => {
                showToast('Error: ' + event.error, true);
                isListening = false;
                micBtn.classList.remove('listening');
                micIcon.textContent = '🎙️';
                robotContainer.classList.remove('listening');
                statusBadge.classList.remove('listening');
            };
        }

        function toggleMic() {
            if (!recognition) return;
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        // Translation using MyMemory API (free, no key required for small usage)
        async function translateHindiToEnglish(text) {
            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=hi|en`;
                const response = await fetch(url);
                const data = await response.json();
                if (data.responseData && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
                throw new Error('No translation found');
            } catch (err) {
                showToast('Translation failed. Using fallback.', true);
                // Simple fallback for demo purposes
                return `[Translation unavailable] You said: "${text}"`;
            }
        }

        // Text to Speech in English
        function speakEnglish(text) {
            if (!window.speechSynthesis) return;

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;

            utterance.onstart = () => {
                robotContainer.classList.add('speaking');
                statusBadge.classList.add('speaking');
                statusText.textContent = 'Speaking in English...';
                hintText.textContent = 'Robot is replying in English...';
            };

            utterance.onend = () => {
                robotContainer.classList.remove('speaking');
                statusBadge.classList.remove('speaking');
                statusText.textContent = 'Tap mic & speak in Hindi';
                hintText.textContent = 'Press the microphone and speak in Hindi';
            };

            // Try to find a good English voice
            const voices = window.speechSynthesis.getVoices();
            const enVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) 
                         || voices.find(v => v.lang.startsWith('en'));
            if (enVoice) utterance.voice = enVoice;

            window.speechSynthesis.speak(utterance);
        }

        // Load voices
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
            // Pre-load voices
            window.speechSynthesis.getVoices();
        }

        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? '' : ' info');
            if (!isError) {
                toast.style.background = 'rgba(0, 212, 255, 0.9)';
            } else {
                toast.style.background = 'rgba(255, 68, 102, 0.9)';
            }
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Auto-show cards with demo text briefly then hide
        setTimeout(() => {
            hindiCard.classList.remove('visible');
            englishCard.classList.remove('visible');
        }, 100);
    </script>
</body>
</html>
