<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolu Robot – Hindi Talking Robot</title>
<style>
:root{--bg:#07070f;--fg:#f2f2ff;--mut:#9a9ab8;--card:#14142a;--a:#7c5cff;--b:#00d4ff;--c:#ff4fd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f3fb;--fg:#15152b;--mut:#5c5c7a;--card:#fff}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:18px;margin:14px 0 0;letter-spacing:.5px}
#status{color:var(--mut);font-size:14px;margin-top:4px;min-height:20px}
#stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
#orb{position:relative;width:min(70vw,300px);aspect-ratio:1;display:grid;place-items:center}
.blob{position:absolute;inset:0;border-radius:50%;filter:blur(18px);opacity:.85;mix-blend-mode:screen;animation:spin 6s linear infinite}
.b1{background:radial-gradient(circle at 30% 30%,var(--b),transparent 60%)}
.b2{background:radial-gradient(circle at 70% 35%,var(--c),transparent 60%);animation-duration:8s;animation-direction:reverse}
.b3{background:radial-gradient(circle at 50% 75%,var(--a),transparent 60%);animation-duration:10s}
.ring{position:absolute;inset:-6%;border-radius:50%;border:2px solid var(--b);opacity:0}
#orb{animation:breathe 4s ease-in-out infinite}
#orb.listening{animation:pulse 1s ease-in-out infinite}
#orb.listening .ring{animation:ripple 1.6s ease-out infinite}
#orb.thinking .blob{animation-duration:1.2s}
#orb.speaking{animation:talk .45s ease-in-out infinite}
#orb.speaking .ring{animation:ripple 1s ease-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.04)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes ripple{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.45);opacity:0}}
#face{position:relative;width:66%;aspect-ratio:1;border-radius:34%;background:linear-gradient(160deg,#2b2b4d,#12122a);border:2px solid rgba(255,255,255,.2);box-shadow:0 8px 30px rgba(0,0,0,.45),inset 0 0 20px rgba(0,212,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12%}
#face:before{content:"";position:absolute;top:-16%;width:4px;height:16%;background:#8a8ab0}
#face:after{content:"";position:absolute;top:-24%;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.eyes{display:flex;gap:22%;width:60%;justify-content:center}
.eye{width:28%;aspect-ratio:1;border-radius:50%;background:var(--b);box-shadow:0 0 14px var(--b);animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
#mouth{width:34%;height:13%;background:#0a0a1c;border:3px solid var(--b);border-radius:0 0 50px 50px;transition:height .1s}
#orb.speaking #mouth{animation:mouth .28s ease-in-out infinite}
#orb.listening .eye{transform:scale(1.25);animation:none}
@keyframes mouth{0%,100%{height:8%}50%{height:24%}}
#panel{width:min(94vw,520px);background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:10px;box-shadow:0 4px 24px rgba(0,0,0,.25)}
.row{margin-bottom:8px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}
.hi{font-size:18px;line-height:1.35;min-height:24px}
.en{font-size:15px;color:var(--b);line-height:1.35;min-height:20px}
#ctl{display:flex;gap:10px;align-items:center;width:min(94vw,520px);margin-bottom:14px}
#mic{width:64px;height:64px;flex:none;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:28px;box-shadow:0 6px 20px rgba(124,92,255,.5)}
#mic.on{background:linear-gradient(135deg,#ff4f6d,var(--c))}
#txt{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1px solid rgba(128,128,160,.35);background:var(--card);color:var(--fg);font-size:15px}
#send{padding:12px 14px;border-radius:14px;border:0;background:var(--card);color:var(--fg);cursor:pointer;font-size:15px;border:1px solid rgba(128,128,160,.35)}
label.auto{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:4px;margin-bottom:8px}
</style>
</head>
<body>
<h1>🤖 बोलू रोबोट</h1>
<div id="status">माइक दबाओ और हिंदी में बोलो</div>

<div id="stage">
  <div id="orb">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="ring"></div>
    <div id="face"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div id="mouth"></div></div>
  </div>
</div>

<div id="panel">
  <div class="row"><div class="lbl">आपने कहा / You said</div><div class="hi" id="uHi">—</div><div class="en" id="uEn"></div></div>
  <div class="row"><div class="lbl">रोबोट / Robot</div><div class="hi" id="rHi">—</div><div class="en" id="rEn"></div></div>
</div>

<label class="auto"><input type="checkbox" id="auto" checked> बातचीत मोड (जवाब के बाद अपने आप सुने) / Auto-listen</label>
<div id="ctl">
  <button id="mic" aria-label="Microphone">🎤</button>
  <input id="txt" placeholder="या यहाँ लिखो… (type here)">
  <button id="send">भेजो</button>
</div>

<script>
const $=id=>document.getElementById(id);
const orb=$('orb'),statusEl=$('status'),mic=$('mic');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,voices=[];

function setState(s,msg){orb.className=s||'';mic.classList.toggle('on',s==='listening');if(msg)statusEl.textContent=msg;}

/* ---------- voices ---------- */
function loadVoices(){voices=speechSynthesis.getVoices();}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function hindiVoice(){return voices.find(v=>/hi[-_]IN/i.test(v.lang))||voices.find(v=>/^hi/i.test(v.lang))||null;}

/* ---------- brain ---------- */
const has=(t,a)=>a.some(k=>t.includes(k));
function numHi(n){return String(n);}
const R=[
 {k:['नमस्ते','नमस्कार','हेलो','हैलो','हेल्लो','hello','hi ','namaste','हाय'],f:()=>['नमस्ते दोस्त! मैं बोलू रोबोट हूँ। आप कैसे हैं?','Hello friend! I am Bolu Robot. How are you?']},
 {k:['कैसे हो','कैसे हैं','कैसा है','kaise ho','how are you','क्या हाल'],f:()=>['मैं बहुत बढ़िया हूँ! आपसे बात करके और भी मज़ा आ गया।','I am doing great! Talking to you made it even more fun.']},
 {k:['तुम्हारा नाम','आपका नाम','तेरा नाम','तुम कौन','आप कौन','who are you','your name','नाम क्या'],f:()=>['मेरा नाम बोलू है। मैं एक बोलने वाला रोबोट हूँ।','My name is Bolu. I am a talking robot.']},
 {k:['मेरा नाम'],f:t=>{const m=t.match(/मेरा नाम\s+(.+?)(?:\s+है|$)/);const n=m?m[1]:'दोस्त';return[`वाह ${n}! आपसे मिलकर बहुत खुशी हुई।`,`Wow ${n}! Very nice to meet you.`];}},
 {k:['समय','टाइम','बजे','time'],f:()=>{const d=new Date();const h=d.getHours()%12||12,m=d.getMinutes();return[`अभी ${numHi(h)} बजकर ${numHi(m)} मिनट हुए हैं।`,`It is ${h}:${String(m).padStart(2,'0')} right now.`];}},
 {k:['तारीख','आज की','दिन क्या','date','आज कौन'],f:()=>{const d=new Date();return[`आज की तारीख ${d.toLocaleDateString('hi-IN',{day:'numeric',month:'long',year:'numeric',weekday:'long'})} है।`,`Today is ${d.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric',weekday:'long'})}.`];}},
 {k:['जोक','चुटकुला','joke','हँसा','हंसा'],f:()=>{const j=[['टीचर ने पूछा, बताओ सबसे तेज़ क्या चलता है? बंटी बोला, मेरा मोबाइल डेटा सर, खत्म भी जल्दी होता है!','Teacher asked: what runs the fastest? Bunty said: my mobile data sir, it finishes quickly too!'],['रोबोट ने डॉक्टर से कहा, मुझे वायरस हो गया है। डॉक्टर बोला, तो अपडेट ले लो!','The robot told the doctor, I have a virus. The doctor said, then take an update!'],['पापा बोले, बेटा मोबाइल रखो। बेटा बोला, पापा, पहले आप चार्जर तो दो!','Dad said: son, put the phone down. Son said: Dad, first give me the charger!']];return j[Math.floor(Math.random()*j.length)];}},
 {k:['धन्यवाद','शुक्रिया','थैंक','thank'],f:()=>['कोई बात नहीं दोस्त! हमेशा हाज़िर हूँ।','You are welcome, friend! Always here for you.']},
 {k:['बाय','अलविदा','फिर मिलेंगे','bye','टाटा'],f:()=>['अलविदा दोस्त! जल्दी फिर मिलना।','Goodbye friend! Meet again soon.']},
 {k:['प्यार','लव','love'],f:()=>['मैं भी अपने सभी दोस्तों से बहुत प्यार करता हूँ!','I love all my friends too!']},
 {k:['खाना','भूख','पिज़्ज़ा','समोसा','चाय'],f:()=>['वाह! मुझे तो गरमा गरम समोसे और चाय पसंद हैं, लेकिन मैं रोबोट हूँ, बिजली पीता हूँ!','Wow! I like hot samosas and tea, but I am a robot, I drink electricity!']},
 {k:['गाना','गाओ','सिंग','sing'],f:()=>['ला ला ला, मैं रोबोट हूँ, बोलू बोलू बोलू! कैसा लगा मेरा गाना?','La la la, I am a robot, Bolu Bolu Bolu! How was my song?']},
 {k:['मौसम','weather','बारिश'],f:()=>['मैं खिड़की से बाहर तो देख नहीं सकता, लेकिन आप मौसम ऐप देख लीजिए!','I cannot look out of the window, but please check a weather app!']},
 {k:['उम्र','कितने साल','age'],f:()=>['मैं अभी नया नया बना हूँ, बस कुछ मिनट का!','I was just built, only a few minutes old!']},
 {k:['मदद','हेल्प','क्या कर सकते','help'],f:()=>['आप मुझसे नमस्ते, जोक, समय, तारीख या गाना बोल सकते हैं। मैं आपकी बात दोहरा भी सकता हूँ!','You can say hello, joke, time, date or song. I can also repeat what you say!']}
];

/* small Hindi → English word helper for your own words */
const D={'मैं':'I','मै':'I','मुझे':'me','मेरा':'my','मेरी':'my','तुम':'you','आप':'you','तुम्हारा':'your','आपका':'your','क्या':'what','कैसे':'how','कौन':'who','कहाँ':'where','कब':'when','क्यों':'why','है':'is','हैं':'are','हो':'are','हूँ':'am','हूं':'am','नहीं':'not','और':'and','का':'of','की':'of','के':'of','में':'in','से':'from','को':'to','पर':'on','यह':'this','वह':'that','आज':'today','कल':'tomorrow','अभी':'now','समय':'time','नाम':'name','खाना':'food','पानी':'water','चाय':'tea','घर':'home','दोस्त':'friend','प्यार':'love','अच्छा':'good','बढ़िया':'great','बहुत':'very','नमस्ते':'hello','धन्यवाद':'thank you','शुक्रिया':'thank you','हाँ':'yes','हां':'yes','जी':'sir','बताओ':'tell','सुनाओ':'tell','गाना':'song','जोक':'joke','चुटकुला':'joke','मौसम':'weather','कर':'do','रहे':'doing','रहा':'doing','रही':'doing','चाहिए':'want','चाहता':'want','जाना':'go','आना':'come','देखो':'look','बोलो':'speak','कैसा':'how','कितना':'how much','कितने':'how many','साल':'years','उम्र':'age','अलविदा':'goodbye','बाय':'bye','हेलो':'hello','हैलो':'hello','तुमसे':'with you','आपसे':'with you','बात':'talk','मजा':'fun','मज़ा':'fun','खुश':'happy','दुखी':'sad','भूख':'hunger','लगी':'felt','लगा':'felt','सकते':'can','सकता':'can','ना':'no','तो':'then','भी':'also','ही':'only','एक':'one','दो':'two','तीन':'three'};
function toEn(t){
  if(!/[\u0900-\u097F]/.test(t))return t;
  const w=t.split(/\s+/).map(x=>D[x]||x);
  return w.join(' ')+'  (approx.)';
}

function reply(text){
  const t=text.toLowerCase().trim();
  for(const r of R){if(has(t,r.k))return r.f(t);}
  return [`तुमने कहा: ${text}। वाह, मुझे यह बात दोहराना अच्छा लगा! कुछ और बोलो।`,`You said: ${toEn(text)}. Wow, I loved repeating that! Say something else.`];
}

/* ---------- flow ---------- */
function handle(text){
  if(!text.trim())return;
  $('uHi').textContent=text;$('uEn').textContent='🇬🇧 '+toEn(text);
  setState('thinking','सोच रहा हूँ… / Thinking…');
  setTimeout(()=>{
    const [hi,en]=reply(text);
    $('rHi').textContent=hi;$('rEn').textContent='🇬🇧 '+en;
    speak(hi);
  },500);
}

function speak(text){
  if(!('speechSynthesis' in window)){setState('','Voice not supported in this browser');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const v=hindiVoice();if(v)u.voice=v;
  u.lang='hi-IN';u.pitch=1.5;u.rate=1;
  u.onstart=()=>setState('speaking','बोल रहा हूँ… / Speaking…');
  u.onend=u.onerror=()=>{setState('','माइक दबाओ और बोलो / Tap mic to talk');if($('auto').checked)setTimeout(startListen,400);};
  speechSynthesis.speak(u);
}

function startListen(){
  if(listening)return;
  if(!SR){setState('','इस ब्राउज़र में माइक सपोर्ट नहीं है। Chrome इस्तेमाल करो या नीचे लिखो।');return;}
  speechSynthesis.cancel();
  rec=new SR();rec.lang='hi-IN';rec.interimResults=true;rec.continuous=false;
  let finalText='';
  rec.onstart=()=>{listening=true;setState('listening','सुन रहा हूँ… / Listening…');};
  rec.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal)finalText+=r[0].transcript;else interim+=r[0].transcript;
    }
    $('uHi').textContent=finalText||interim;
  };
  rec.onerror=e=>{
    listening=false;
    if(e.error==='not-allowed'||e.error==='service-not-allowed')setState('','माइक की अनुमति दो (Allow microphone)');
    else if(e.error==='no-speech')setState('','कुछ सुनाई नहीं दिया, फिर से कोशिश करो');
    else setState('','Error: '+e.error);
  };
  rec.onend=()=>{
    listening=false;
    if(finalText.trim())handle(finalText);
    else if(orb.className==='listening')setState('','माइक दबाओ और बोलो / Tap mic to talk');
  };
  try{rec.start();}catch(err){}
}
function stopListen(){if(rec&&listening)rec.stop();}

mic.onclick=()=>{listening?stopListen():startListen();};
$('send').onclick=()=>{const v=$('txt').value;$('txt').value='';handle(v);};
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click();});
if(!SR)statusEl.textContent='Chrome/Edge में खोलो, तब माइक चलेगा (या नीचे लिखो)';
</script>
</body>
</html>
