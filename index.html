<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bright Full Moon Animation</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #020617;
  }
  .sky {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 48%, rgba(19, 39, 79, .45) 0%, transparent 48%),
      linear-gradient(180deg, #020617 0%, #07132d 55%, #020617 100%);
  }
  .stars, .stars::before, .stars::after {
    position: absolute; inset: 0; content: "";
    background-repeat: repeat;
    pointer-events: none;
  }
  .stars {
    opacity: .9;
    background-image:
      radial-gradient(2px 2px at 24px 40px, #fff 98%, transparent),
      radial-gradient(1px 1px at 90px 130px, #dbeafe 98%, transparent),
      radial-gradient(1.5px 1.5px at 180px 70px, #fff 98%, transparent),
      radial-gradient(1px 1px at 250px 190px, #bfdbfe 98%, transparent),
      radial-gradient(2px 2px at 320px 30px, #fff 98%, transparent),
      radial-gradient(1px 1px at 390px 150px, #fff 98%, transparent);
    background-size: 420px 230px;
    animation: drift 80s linear infinite;
  }
  .stars::before {
    opacity: .75;
    background-image:
      radial-gradient(1px 1px at 45px 95px, #fff 98%, transparent),
      radial-gradient(1px 1px at 150px 20px, #fff 98%, transparent),
      radial-gradient(2px 2px at 280px 120px, #e0f2fe 98%, transparent),
      radial-gradient(1px 1px at 360px 210px, #fff 98%, transparent);
    background-size: 370px 260px;
    animation: twinkle 3.8s ease-in-out infinite alternate;
  }
  .stars::after {
    opacity: .45;
    background-image:
      radial-gradient(1px 1px at 70px 60px, #fff 98%, transparent),
      radial-gradient(1px 1px at 210px 180px, #fff 98%, transparent),
      radial-gradient(1.5px 1.5px at 330px 90px, #dbeafe 98%, transparent);
    background-size: 440px 290px;
    animation: twinkle 5s ease-in-out infinite alternate-reverse;
  }
  .moon-wrap {
    position: absolute; left: 50%; top: 46%;
    width: min(48vw, 48vh, 390px);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    animation: moonZoom 8s ease-in-out infinite;
    filter: drop-shadow(0 0 28px rgba(191, 219, 254, .35));
  }
  .moon {
    width: 100%; height: 100%; border-radius: 50%; position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 35% 28%, rgba(255,255,255,.98) 0%, rgba(239,246,255,.98) 22%, rgba(203,218,239,.98) 57%, #9aaecb 100%);
    box-shadow:
      0 0 18px 6px rgba(219,234,254,.48),
      0 0 55px 18px rgba(147,197,253,.23),
      inset -18px -14px 35px rgba(51,65,85,.3),
      inset 9px 8px 22px rgba(255,255,255,.8);
  }
  /* Soft lunar craters */
  .crater {
    position: absolute; border-radius: 50%;
    background: rgba(115, 133, 160, .12);
    box-shadow: inset 4px 5px 8px rgba(65, 80, 105, .22),
                inset -3px -3px 5px rgba(255,255,255,.22);
  }
  .c1 { width: 18%; height: 18%; left: 22%; top: 22%; }
  .c2 { width: 10%; height: 10%; left: 58%; top: 25%; }
  .c3 { width: 23%; height: 23%; left: 48%; top: 53%; }
  .c4 { width: 12%; height: 12%; left: 25%; top: 63%; }
  .c5 { width: 8%; height: 8%; left: 70%; top: 48%; }
  .c6 { width: 7%; height: 7%; left: 40%; top: 42%; }
  .horizon-glow {
    position: absolute; left: 50%; top: 74%; width: 70vw; height: 25vh;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(59,130,246,.12), transparent 70%);
    filter: blur(20px);
  }
  @keyframes moonZoom {
    0%, 100% { transform: translate(-50%, -50%) scale(.96); }
    50% { transform: translate(-50%, -50%) scale(1.06); }
  }
  @keyframes twinkle {
    from { opacity: .25; }
    to { opacity: .95; }
  }
  @keyframes drift {
    from { transform: translateY(0); }
    to { transform: translateY(-230px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .moon-wrap, .stars, .stars::before, .stars::after { animation: none; }
  }
</style>
</head>
<body>
  <main class="sky" aria-label="Bright full moon and stars animated night sky">
    <div class="stars"></div>
    <div class="horizon-glow"></div>
    <div class="moon-wrap">
      <div class="moon">
        <span class="crater c1"></span>
        <span class="crater c2"></span>
        <span class="crater c3"></span>
        <span class="crater c4"></span>
        <span class="crater c5"></span>
        <span class="crater c6"></span>
      </div>
    </div>
  </main>
</body>
</html>
